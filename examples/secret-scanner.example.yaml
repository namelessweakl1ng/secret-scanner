# Example secret-scanner.yaml configuration.
# Copy this file to your project root and edit as needed.

# Detection tuning.
min_entropy: 4.5           # Shannon entropy threshold for high-entropy detection.
min_length: 12             # Minimum match length for any rule.
max_length: 4096           # Maximum match length for any rule.
max_line_length: 100000    # Skip lines longer than this (ReDoS protection).
enable_entropy: true       # Enable entropy-based detection.
enable_context: true       # Enable variable-name context detection.
enable_path_rules: true    # Enable sensitive-filename detection (.env, id_rsa, ...).

# File scanning.
max_file_size_mb: 20       # Skip files larger than this.
follow_symlinks: false     # Follow symlinks during directory walk.

# Ignore system.
use_gitignore: true        # Respect .gitignore files.
ignore:                    # Custom glob patterns (gitignore syntax).
  - "tests/fixtures/**"
  - "*.sample"
  - "*.example"
ignore_regex:              # Custom regex patterns to ignore.
  - "^vendor/.+$"
  - "_test\\.py$"

# Performance.
workers: 4                 # Number of parallel worker threads.

# Custom rule files (merged with built-ins).
# Rules with the same `id` override built-ins.
rules:
  - ./rules/my-rules.yaml

# Severity overrides.
# Lower or raise the severity of built-in rules.
severity_overrides:
  discord_bot_token: medium   # downgrade from high
  slack_token: critical       # upgrade from high

# CI exit-code threshold.
# Exit non-zero if any finding at this severity or higher is found.
# Options: info, low, medium, high, critical, or null (always exit 0).
fail_on_severity: high
