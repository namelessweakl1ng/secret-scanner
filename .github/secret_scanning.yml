# Secret Scanning configuration for GitHub.
# This file tells GitHub's built-in secret scanner to ignore findings
# in test fixture directories and documentation examples.
#
# Note: This feature is available on GitHub Enterprise Cloud and on
# GitHub Free/Pro/Team for public repositories. For private repositories
# on Free/Pro/Team, you may need to upgrade or use push protection
# bypasses instead.

# Paths to ignore during secret scanning.
# These directories contain intentionally-fake test fixtures and
# documentation examples that may match secret patterns.
paths-ignore:
  - "tests/samples.py"
  - "tests/test_detectors.py"
  - "tests/test_local_scanner.py"
  - "tests/test_archive_scanner.py"
  - "tests/test_git_scanner.py"
  - "tests/test_cli.py"
  - "tests/test_models.py"
  - "examples/**"
  - "docs/**"
  - "secret_scanner/rules/data/**"
  - "README.md"
  - "CONTRIBUTING.md"
  - "SECURITY.md"
  - "CHANGELOG.md"
