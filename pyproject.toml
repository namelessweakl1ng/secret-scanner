[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "secret-scanner"
version = "1.0.0"
description = "Production-grade secret scanner: detect leaked credentials, API keys, tokens, and private keys in local files, git repos, GitHub/GitLab/Bitbucket, gists, and archives."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Secret Scanner Contributors" },
]
keywords = [
    "security",
    "secrets",
    "scanner",
    "credentials",
    "leak-detection",
    "devsecops",
    "ci-cd",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "pathspec>=0.12.1",
    "orjson>=3.10.0",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
    "rapidfuzz>=3.6.0",
]

[project.optional-dependencies]
git = ["gitpython>=3.1.40"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
secret-scanner = "secret_scanner.cli.main:app"

[project.urls]
Homepage = "https://github.com/secret-scanner/secret-scanner"
Documentation = "https://github.com/secret-scanner/secret-scanner#readme"
Issues = "https://github.com/secret-scanner/secret-scanner/issues"

[tool.hatch.build.targets.wheel]
packages = ["secret_scanner"]

[tool.hatch.build.targets.sdist]
include = [
    "secret_scanner",
    "tests",
    "docs",
    "examples",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=secret_scanner --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:pathspec.*",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["secret_scanner"]
omit = ["*/tests/*", "*/test_*.py"]
