# Private keys, certificates, and key material.
version: 1
rules:
  - id: rsa_private_key
    name: RSA Private Key
    provider: rsa_private_key
    pattern: '-----BEGIN RSA PRIVATE KEY-----'
    severity: critical
    exact_format: true
    min_length: 31
    description: PEM-encoded RSA private key header
    tags: [private_key, rsa, pem]

  - id: ec_private_key
    name: EC Private Key
    provider: ec_private_key
    pattern: '-----BEGIN EC PRIVATE KEY-----'
    severity: critical
    exact_format: true
    min_length: 30
    description: PEM-encoded EC (elliptic curve) private key header
    tags: [private_key, ecdsa, pem]

  - id: openssh_private_key
    name: OpenSSH Private Key
    provider: ssh_private_key
    pattern: '-----BEGIN OPENSSH PRIVATE KEY-----'
    severity: critical
    exact_format: true
    min_length: 35
    description: OpenSSH-format private key header (id_ed25519, id_rsa modern)
    tags: [private_key, ssh, openssh]

  - id: dsa_private_key
    name: DSA Private Key
    provider: dsa_private_key
    pattern: '-----BEGIN DSA PRIVATE KEY-----'
    severity: critical
    exact_format: true
    min_length: 31
    description: PEM-encoded DSA private key header
    tags: [private_key, dsa, pem]

  - id: pgp_private_key
    name: PGP Private Key
    provider: pgp_private_key
    pattern: '-----BEGIN PGP PRIVATE KEY BLOCK-----'
    severity: critical
    exact_format: true
    min_length: 36
    description: PGP private key block header
    tags: [private_key, pgp, pem]

  - id: ec_param_block
    name: EC Parameters Block
    provider: ec_private_key
    pattern: '-----BEGIN EC PARAMETERS-----'
    severity: medium
    min_length: 30
    description: PEM-encoded EC parameters (sometimes adjacent to private keys)
    tags: [private_key, ecdsa, pem]

  - id: pkcs8_private_key
    name: PKCS8 Private Key
    provider: private_key
    pattern: '-----BEGIN PRIVATE KEY-----'
    severity: critical
    exact_format: true
    min_length: 27
    description: PEM-encoded PKCS8 private key (algorithm-agnostic)
    tags: [private_key, pkcs8, pem]

  - id: encrypted_private_key
    name: Encrypted Private Key
    provider: private_key
    pattern: '-----BEGIN ENCRYPTED PRIVATE KEY-----'
    severity: critical
    exact_format: true
    min_length: 37
    description: PEM-encoded encrypted PKCS8 private key
    tags: [private_key, pkcs8, pem, encrypted]

  - id: x509_certificate
    name: X.509 Certificate
    provider: x509_certificate
    pattern: '-----BEGIN CERTIFICATE-----'
    severity: info
    min_length: 25
    description: PEM-encoded X.509 certificate (public, low severity)
    tags: [certificate, pem]

  # ---- OpenVPN / WireGuard ----
  - id: openvpn_static_key
    name: OpenVPN Static Key
    provider: openvpn_key
    pattern: '-----BEGIN OpenVPN Static key V1-----'
    severity: critical
    exact_format: true
    min_length: 38
    description: OpenVPN TLS static key
    tags: [openvpn, private_key]

  - id: wireguard_config
    name: WireGuard Config Section
    provider: wireguard
    pattern: '(?i)\[Interface\][\s\S]{0,200}PrivateKey\s*=\s*[A-Za-z0-9+/]{43}='
    severity: high
    min_length: 43
    description: WireGuard interface section with private key
    tags: [wireguard, private_key]

  # ---- JWT / OAuth ----
  - id: jwt_token
    name: JWT Token
    provider: jwt
    pattern: '\beyJ[A-Za-z0-9_\-]+\.eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\b'
    severity: high
    exact_format: true
    min_length: 30
    description: JWT (JSON Web Token), 3-part dot-separated base64
    tags: [jwt, auth]

  - id: jwt_secret_context
    name: JWT Secret (context)
    provider: jwt_secret
    pattern: '(?i)jwt[_-]?(secret|signing[_-]?key|key)[\s:=]+["'']([A-Za-z0-9_\-]{16,})["'']'
    severity: high
    min_length: 16
    description: JWT signing secret in a variable
    tags: [jwt, auth, secret]

  # ---- OAuth ----
  - id: oauth_client_secret
    name: OAuth Client Secret (context)
    provider: client_secret
    pattern: '(?i)(oauth|client)[_-]?secret[\s:=]+["'']([A-Za-z0-9_\-]{16,})["'']'
    severity: high
    min_length: 16
    description: OAuth client secret
    tags: [oauth, secret]

  # ---- Web3 / crypto wallets ----
  - id: ethereum_private_key
    name: Ethereum Private Key (context)
    provider: ethereum_private_key
    pattern: '(?i)(eth|ethereum)[_-]?private[_-]?key[\s:=]+["'']?(0x)?([0-9a-fA-F]{64})["'']?'
    severity: critical
    min_length: 64
    description: Ethereum private key (64-hex) in context
    tags: [ethereum, crypto, private_key]

  - id: solana_private_key
    name: Solana Private Key (context)
    provider: solana_private_key
    pattern: '(?i)sol[_-]?private[_-]?key[\s:=]+["'']?\[([0-9,\s]{200,})\]["'']?'
    severity: critical
    min_length: 200
    description: Solana private key (JSON array form)
    tags: [solana, crypto, private_key]

  - id: bitcoin_wif
    name: Bitcoin WIF Private Key
    provider: bitcoin_wif
    pattern: '\b[5KL][1-9A-HJ-NP-Za-km-z]{50,51}\b'
    severity: critical
    exact_format: true
    min_length: 51
    max_length: 52
    description: Bitcoin Wallet Import Format (WIF) private key
    tags: [bitcoin, crypto, private_key]

  - id: mnemonic_seed_phrase
    name: BIP39 Mnemonic Seed Phrase
    provider: seed_phrase
    pattern: '\b(?:abandon|ability|able|about|above|absent|absorb|abstract|absurd|abuse|access|accident|account|accuse|achieve|acid|acoustic|acquire|across|act|action|actor|actress|actual|adapt|add|addict|address|adjust|admit|adult|advance|advice|aerobic|affair|afford|afraid|again|age|agent|agree|ahead|aim|air|airport|aisle|alarm|album|alcohol|alert|alien|all|alley|allow|almost|alone|alpha|already|also|alter|always|amateur|amazing|among|amount|amused|analyst|anchor|ancient|anger|angle|angry|animal|ankle|announce|annual|another|answer|antenna|antique|anxiety|any|apart|apology|appear|apple|approve|april|arch|arctic|area|arena|argue|arm|armed|armor|army|around|arrange|arrest|arrive|arrow|art|artefact|artist|artwork|ask|aspect|assault|asset|assist|assume|asthma|athlete|atom|attack|attend|attitude|attract|auction|audit|august|aunt|author|auto|autumn|average|avocado|avoid|awake|aware|away|awesome|awful|awkward|axis|baby|bachelor|bacon|badge|bag|balance|balcony|ball|bamboo|banana|banner|bar|barely|bargain|barrel|base|basic|basket|battle|beach|bean|beauty|because|become|beef|before|begin|behave|behind|believe|below|belt|bench|benefit|best|betray|better|between|beyond|bicycle|bid|bike|bind|biology|bird|birth|bitter|black|blade|blame|blanket|blast|bleak|bless|blind|blood|blossom|blow|blue|blur|blush|board|boat|body|boil|bomb|bone|bonus|book|boost|border|boring|borrow|boss|bottom|bounce|box|boy|bracket|brain|brand|brass|brave|bread|breeze|brick|bridge|brief|bright|bring|brisk|broccoli|broken|bronze|broom|brother|brown|brush|bubble|buddy|budget|buffalo|build|bulb|bulk|bullet|bundle|bunker|burden|burger|burst|bus|business|busy|butter|buyer|buzz|cabbage|cabin|cable|cactus|cage|cake|call|calm|camera|camp|can|canal|cancel|candy|cannon|canoe|canvas|canyon|capable|capital|captain|car|carbon|card|cargo|carpet|carry|cart|case|cash|casino|castle|casual|cat|catalog|catch|category|cattle|caught|cause|caution|cave|ceiling|celery|cement|census|century|cereal|certain|chair|chalk|champion|cha